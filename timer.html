<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customizable Timer</title>
<style>
    body {
        background-color: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
		font-family: arial;
    }
    
    #timer {
        color: red;
        font-size: 20vw;
        font-family: monospace;
    }

    #timer.break {
        font-size: 15vw;
    }

    #clock {
        color: red;
        font-size: 10vw;
        font-family: monospace;
        text-align: center;
    }

    #clock-and-rounds {
        display: flex;
    }

    #rounds-left {
        color: red;
        font-size: 10vw;
        font-family: monospace;
        text-align: left;
    }

    #rounds-right {
        color: red;
        font-size: 10vw;
        font-family: monospace;
        text-align: right;
    }
    
    .timer-buttons, .stopwatch-buttons {
        display: flex;
        justify-content: center;
		align-items: center;
        flex-wrap: wrap;
    }
    
    .timer-button, .stopwatch-button {
        background-color: red;
        color: white;
		cursor: pointer;
		border-radius: 5px;
		border: none;
        margin: 5px;
		height: 40px;
		font-size: 20px;
		display: flex;
		align-items: center;
		justify-content: center;
		box-sizing: border-box;
    }
    
    #breakOptions, .break-buttons {
        color: red;
        font-size: 20px;
    }

    input[type="radio"] {
        display: none;
    }

    input[type="radio"] + label {
        display: inline-block;
        padding: 5px 5px;
        margin: 0 5px;
        cursor: pointer;
        font-size: 20px;
        color: red;
		border-radius: 5px;
    }

    input[type="radio"]:checked + label {
        background-color: red;
        color: white;
    }
	
	#customRoundLength {
        background-color: red;
        color: white;
		border-radius: 5px;
		border: none;
        margin: 5px;
		height: 40px;
		font-size: 20px;
		display: flex;
		align-items: center;
		justify-content: center;
		box-sizing: border-box;
		width: 80px;
        text-align: center;
    }
	
    #customRoundLength::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }
	
	.hidden {
        display: none;
    }
</style>
</head>
<body>
<audio id="beep" src="beep.mp3" preload="auto"></audio>
<audio id="buzzer" src="buzzer.mp3" preload="auto"></audio>
<div id="timer">00:00</div>
<div>
    <input type="radio" id="timer_radio" name="mode" value="timer" onchange="switchMode('timer')" checked> 
	<label for="timer_radio">Timer</label>
    <input type="radio" id="stopwatch_radio" name="mode" value="stopwatch" onchange="switchMode('stopwatch')">
	<label for="stopwatch_radio">Stopwatch</label>
</div>
<div class="timer-buttons">
	<input 
        type="text" 
        id="customRoundLength" 
        placeholder="MM:SS" 
        style="margin-right: 10px;" 
        pattern="\d{1,2}:\d{2}" 
        title="Enter time in MM:SS format">
    <button class="timer-button" onclick="startTimer(1 * 60)">1 Minute</button>
    <button class="timer-button" onclick="startTimer(3 * 60)">3 Minutes</button>
    <button class="timer-button" onclick="startTimer(4 * 60)">4 Minutes</button>
    <button class="timer-button" onclick="startTimer(5 * 60)">5 Minutes</button>
    <button class="timer-button" onclick="startTimer(7 * 60)">7 Minutes</button>
    <button class="timer-button" onclick="startTimer(10 * 60)">10 Minutes</button>
	<button class="timer-button" onclick="startRandomTimer()">Random</button>
    <button class="timer-button" onclick="stopTimer()">Stop</button>
	<button class="timer-button" onclick="resetTimer()">Reset</button>
</div>
<div class="stopwatch-buttons hidden">
    <button class="stopwatch-button" onclick="startStopwatch()">Start</button>
    <button class="stopwatch-button" onclick="stopStopwatch()">Stop</button>
    <button class="stopwatch-button" onclick="resetStopwatch()">Reset</button>
</div>
<br>
<div class="break-buttons">
    Break Duration:
	<input type="radio" id="break0" name="breakDuration" value="0" onchange="updateBreakDuration(0)">
    <label for="break0">0s</label>
	<input type="radio" id="break10" name="breakDuration" value="10" onchange="updateBreakDuration(10)">
    <label for="break10">10s</label>
    <input type="radio" id="break45" name="breakDuration" value="45" onchange="updateBreakDuration(45)">
    <label for="break45">45s</label>
    <input type="radio" id="break60" name="breakDuration" value="60" onchange="updateBreakDuration(60)" checked>
    <label for="break60">60s</label>
</div>
<div id="clock-and-rounds">
    <div id="rounds-left">R0 -</div>
    <div id="clock">00:00:00</div>
    <div id="rounds-right">- R0</div>
</div>

<script>
    // --- State Variables ---
    let timerInterval; 
    let countdownInterval; 
    let stopwatchInterval;
    
    let breakDuration = 60; // Default 60s
    let roundsCount = 0; 
    let mode = "timer"; 
    
    // Flags
    let timerRunning = false;
    let stopwatchRunning = false;
    let elapsedTime = 0; 

    // --- Audio Helper ---
    function playAudio(audioElement) {
        if (audioElement) {
            audioElement.currentTime = 0;
            audioElement.play().catch(e => console.log("Audio blocked:", e));
        }
    }

    // --- Clock Display ---
    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
        document.getElementById('clock').textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock(); // Run immediately

    // --- Mode Switching ---
    function switchMode(selectedMode) {
        mode = selectedMode;
        const timerButtons = document.querySelector('.timer-buttons');
        const stopwatchButtons = document.querySelector('.stopwatch-buttons');
        const breakButtons = document.querySelector('.break-buttons');
        const timerDisplay = document.getElementById('timer');

        // Stop any running timers when switching
        stopTimer();
        stopStopwatch();
        resetDisplay();

        if (mode === 'timer') {
            timerButtons.classList.remove('hidden');
            stopwatchButtons.classList.add('hidden');
            breakButtons.classList.remove('hidden');
        } else {
            stopwatchButtons.classList.remove('hidden');
            timerButtons.classList.add('hidden');
            breakButtons.classList.add('hidden');
        }
    }

    // --- Core Timer Logic (Drift-Free) ---
    function startTimerLogic(getDurationFn, isRandom = false) {
        if (timerRunning) return;
        timerRunning = true;

        const timerDisplay = document.getElementById('timer');
        let countdown = 10;
        
        // --- 10s Countdown ---
        timerDisplay.textContent = countdown;
        timerDisplay.classList.remove('break');
        
        // Use Delta Time for Countdown to prevent drift
        const countdownEndTime = Date.now() + (countdown * 1000);

        countdownInterval = setInterval(() => {
            const now = Date.now();
            const remaining = Math.ceil((countdownEndTime - now) / 1000);
            
            if (remaining !== countdown) {
                countdown = remaining;
                timerDisplay.textContent = countdown > 0 ? countdown : 0;
                
                if (countdown <= 5 && countdown > 0) {
                    playAudio(document.getElementById('beep'));
                }
            }

            if (remaining <= 0) {
                clearInterval(countdownInterval);
                playAudio(document.getElementById('buzzer'));
                
                // --- Start Main Phase ---
                runMainPhase(getDurationFn, isRandom);
            }
        }, 100); // Check every 100ms for smoothness
    }

    function runMainPhase(getDurationFn, isRandom) {
        const timerDisplay = document.getElementById('timer');
        let isBreak = false;
        
        // Initial Rounds Increment
        roundsCount++;
        updateRoundsDisplay();

        // Calculate Target Time
        let currentDuration = getDurationFn(); 
        let endTime = Date.now() + (currentDuration * 1000);

        timerInterval = setInterval(() => {
            const now = Date.now();
            const timeLeft = Math.ceil((endTime - now) / 1000);

            // Audio cues for last 5 seconds
            if (timeLeft <= 5 && timeLeft > 0) {
                // To avoid multiple beeps in the same second due to fast polling, 
                // we check if we haven't beeped for this second yet.
                // Simplified approach: just beep.
                // For a more robust solution, we'd track 'lastBeepTime'. 
                // But given the 1s resolution of the beep file, standard 1000ms interval check is safer.
                // Let's stick to updating text and checking beep logic in 1s steps visually,
                // but using delta time for accuracy.
            }

            // Display Update
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            if (isBreak) {
                timerDisplay.textContent = 'Break: ' + seconds;
                timerDisplay.classList.add('break');
            } else {
                timerDisplay.textContent = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
                timerDisplay.classList.remove('break');
            }
            
            // Handle Beeps (Approximate check ensures we don't miss it)
            // We check if we just crossed a second boundary
            const msUntilNextSecond = (endTime - now) % 1000;
            if (timeLeft <= 5 && timeLeft > 0 && msUntilNextSecond > 900) {
                 playAudio(document.getElementById('beep'));
            }

            // Time's Up
            if (timeLeft <= 0) {
                playAudio(document.getElementById('buzzer'));

                // Switch Phase
                if (isBreak) {
                    // End of Break -> Start Round
                    isBreak = false;
                    currentDuration = getDurationFn(); // Get new round time
                    roundsCount++;
                    updateRoundsDisplay();
                } else {
                    // End of Round -> Start Break
                    if (breakDuration > 0) {
                        isBreak = true;
                        currentDuration = breakDuration;
                    } else {
                        // Skip break if set to 0
                        isBreak = false;
                        currentDuration = getDurationFn();
                        roundsCount++;
                        updateRoundsDisplay();
                    }
                }
                
                // Set new Target
                endTime = Date.now() + (currentDuration * 1000);
            }
        }, 100); // High-res polling for accuracy
    }

    // --- Public Functions called by Buttons ---

    function startTimer(duration) {
        // Wrapper to pass a fixed duration function
        startTimerLogic(() => duration); 
    }

    function startRandomTimer() {
        // Wrapper to pass a random duration function
        startTimerLogic(() => {
            const times = [1, 3, 4, 5, 7, 10]; 
            const randomIndex = Math.floor(Math.random() * times.length);
            return times[randomIndex] * 60;
        }, true);
    }

    function stopTimer() {
        clearInterval(countdownInterval);
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timer').textContent = "Stopped";
    }

    function resetTimer() {
        stopTimer();
        stopStopwatch();
        resetDisplay();
    }
    
    function resetDisplay() {
        roundsCount = 0;
        updateRoundsDisplay();
        document.getElementById('timer').textContent = "00:00";
        document.getElementById('timer').classList.remove('break');
    }

    function updateBreakDuration(duration) {
        breakDuration = parseInt(duration);
    }
    
    function updateRoundsDisplay() {
        document.getElementById('rounds-left').textContent = 'R' + roundsCount + ' -';
        document.getElementById('rounds-right').textContent = '- ' + 'R' + roundsCount;
    }

    // --- Stopwatch Logic ---
    function startStopwatch() {
        if (stopwatchRunning) return;
        stopwatchRunning = true;
        
        const startTime = Date.now() - elapsedTime;
        const timerDisplay = document.getElementById('timer');

        stopwatchInterval = setInterval(() => {
            elapsedTime = Date.now() - startTime;
            const minutes = Math.floor(elapsedTime / 60000);
            const seconds = Math.floor((elapsedTime % 60000) / 1000);
            const ms = Math.floor((elapsedTime % 1000) / 10); // Optional: show MS
            
            timerDisplay.textContent = 
                minutes.toString().padStart(2, '0') + ':' + 
                seconds.toString().padStart(2, '0');
        }, 50); // Fast update
    }

    function stopStopwatch() {
        if (!stopwatchRunning) return;
        clearInterval(stopwatchInterval);
        stopwatchRunning = false;
    }

    function resetStopwatch() {
        stopStopwatch();
        elapsedTime = 0;
        document.getElementById('timer').textContent = "00:00";
    }

    // --- Custom Input Handling ---
    const customInput = document.getElementById('customRoundLength');
    
    customInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, ''); 
        if (value.length > 4) value = value.slice(0, 4); 
        if (value.length > 2) value = value.slice(0, 2) + ':' + value.slice(2);
        e.target.value = value;
    });

    customInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            const parts = this.value.split(':');
            if (parts.length === 2) {
                const mins = parseInt(parts[0]) || 0;
                const secs = parseInt(parts[1]) || 0;
                startTimer((mins * 60) + secs);
                this.blur(); // Remove focus
            }
        }
    });

    // --- Keyboard Shortcuts ---
    document.addEventListener('keydown', function(event) {
        // Ignore shortcuts if typing in custom box
        if (document.activeElement === customInput) {
            if (event.key === "Escape") customInput.blur();
            return;
        }

        const key = event.key.toLowerCase();

        // Global Controls
        if (key === " " || key === "s") {
            event.preventDefault();
            if (mode === "stopwatch") {
                stopwatchRunning ? stopStopwatch() : startStopwatch();
            } else {
                // For timer, space usually stops. 
                // To "Resume" a standard timer is complex logic not requested, 
                // so we stick to Stop vs Start New.
                stopTimer(); 
            }
        } 
        else if (key === "escape") {
            mode === "stopwatch" ? resetStopwatch() : resetTimer();
        }
        else if (key === "t") {
            // Toggle Mode
            const newMode = mode === "timer" ? "stopwatch" : "timer";
            document.getElementById(newMode + "_radio").checked = true;
            switchMode(newMode);
        }

        // Timer Specific Controls
        if (mode === "timer") {
            if (['1','3','4','5','7'].includes(key)) {
                startTimer(parseInt(key) * 60);
            } else if (key === '0') {
                startTimer(10 * 60);
            } else if (key === 'r') {
                startRandomTimer();
            }
        }
    });

</script>
</body>
</html>
